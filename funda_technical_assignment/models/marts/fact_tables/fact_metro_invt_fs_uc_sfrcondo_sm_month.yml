version: 2

models:
  - name: fact_metro_invt_fs_uc_sfrcondo_sm_month
    description: Monthly metro for-sale inventory for single-family residences and condos.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: region_id
      - name: month_end_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date