version: 2

models:
  - name: fact_national_zorf_growth_uc_sfr_sm_month
    description: National rent forecast growth by forecast base date and target month.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: region_id
      - name: base_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date
      - name: month_end_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date