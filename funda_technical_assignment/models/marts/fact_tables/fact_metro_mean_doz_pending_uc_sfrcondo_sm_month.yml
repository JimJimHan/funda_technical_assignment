version: 2

models:
  - name: fact_metro_mean_doz_pending_uc_sfrcondo_sm_month
    description: Monthly mean days to pending for metro single-family residences and condos.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: region_id
      - name: month_end_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date