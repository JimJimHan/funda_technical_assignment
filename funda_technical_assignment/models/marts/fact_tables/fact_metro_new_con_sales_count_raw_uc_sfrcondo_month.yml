version: 2

models:
  - name: fact_metro_new_con_sales_count_raw_uc_sfrcondo_month
    description: Monthly raw new-construction sales counts for metro single-family residences and condos.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: region_id
      - name: month_end_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date