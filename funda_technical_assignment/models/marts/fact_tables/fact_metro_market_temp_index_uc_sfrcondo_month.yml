version: 2

models:
  - name: fact_metro_market_temp_index_uc_sfrcondo_month
    description: Monthly metro market temperature index for single-family residences and condos.
    columns:
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: region_id
      - name: month_end_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date